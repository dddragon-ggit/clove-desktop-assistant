<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c5cbf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>待办同步</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1625;
      --surface: #241f33;
      --surface2: #2d2741;
      --accent: #7c5cbf;
      --accent-light: #a78bfa;
      --text: #e8e0f0;
      --text2: #9b8fb8;
      --danger: #ef4444;
      --success: #22c55e;
      --orange: #f97316;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, "Microsoft YaHei UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 0 120px 0;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: linear-gradient(135deg, var(--accent), #5b3a9e);
      padding: 16px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    #search-input {
      flex: 1;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }
    #search-input:focus { border-color: rgba(255,255,255,0.5); }
    #search-input::placeholder { color: rgba(255,255,255,0.5); }
    .filter-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filter-tab {
      background: var(--surface2);
      color: var(--text2);
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-tab.active { background: var(--accent); color: white; }
    .filter-tab:active { opacity: 0.8; }
    #todo-list { padding: 8px 16px; }
    .section-header {
      font-size: 13px;
      color: var(--text2);
      font-weight: 600;
      padding: 12px 4px 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .done-header { margin-top: 8px; }
    .todo-card {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      overflow: hidden;
      transition: opacity 0.2s;
    }
    .todo-card.done { opacity: 0.5; }
    .todo-card.urgent { border-left: 3px solid var(--danger); }
    .todo-card.high { border-left: 3px solid var(--orange); }
    .todo-card.overdue { border-left: 3px solid var(--danger); }
    .todo-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .todo-main:active { background: var(--surface2); }
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--text2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .todo-card.done .checkbox {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .todo-info { flex: 1; min-width: 0; }
    .todo-title {
      display: block;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .todo-card.done .todo-title { text-decoration: line-through; color: var(--text2); }
    .todo-desc {
      display: block;
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .todo-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .todo-meta .tag {
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .todo-meta .due-tag { background: rgba(239,68,68,0.2); color: #f87171; }
    .todo-meta .due-tag.soon { background: rgba(249,115,22,0.2); color: #fb923c; }
    .edit-btn {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 18px;
      padding: 14px 8px;
      cursor: pointer;
      line-height: 1;
    }
    .edit-btn:active { color: var(--accent-light); }
    .delete-btn {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 20px;
      padding: 14px;
      cursor: pointer;
      line-height: 1;
    }
    .delete-btn:active { color: var(--danger); }
    .empty {
      text-align: center;
      color: var(--text2);
      padding: 60px 20px;
      font-size: 15px;
    }
    .form-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 20;
    }
    .form-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .form-row select {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 13px;
      -webkit-appearance: none;
    }
    .form-row input[type="date"] {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 13px;
      -webkit-appearance: none;
      color-scheme: dark;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    #todo-input {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    #todo-input:focus { border-color: var(--accent); }
    #todo-input::placeholder { color: var(--text2); }
    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .add-btn:active { background: #6b4faa; }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--surface2);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border: 1px solid var(--success); }
    .toast.error { border: 1px solid var(--danger); }

    /* Edit Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      animation: slide-up 0.25s ease;
    }
    @keyframes slide-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 18px; }
    .modal-close {
      background: var(--surface2);
      border: none;
      color: var(--text2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-field {
      margin-bottom: 14px;
    }
    .modal-field label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .modal-field input,
    .modal-field textarea,
    .modal-field select {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .modal-field input:focus,
    .modal-field textarea:focus,
    .modal-field select:focus { border-color: var(--accent); }
    .modal-field textarea { resize: vertical; min-height: 60px; }
    .modal-field input[type="date"] { color-scheme: dark; }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: var(--accent); color: white; }
    .btn-save:active { background: #6b4faa; }
    .btn-cancel { background: var(--surface2); color: var(--text); }
    .btn-cancel:active { background: #3d3555; }

    /* Token Setup Screen */
    .token-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .token-screen.open { display: flex; }
    .token-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .token-box h2 { font-size: 20px; margin-bottom: 8px; }
    .token-box p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
    .token-box input {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }
    .token-box input:focus { border-color: var(--accent); }
    .token-box .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none; }
    .token-box button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .token-box button:active { background: #6b4faa; }

    /* Nav Tabs */
    .nav-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
    }
    .nav-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text2);
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-tab.active {
      color: var(--accent-light);
      border-bottom-color: var(--accent);
    }

    /* Note Cards */
    .note-card {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .note-main {
      flex: 1;
      padding: 14px;
      cursor: pointer;
      min-width: 0;
    }
    .note-main:active { background: var(--surface2); }
    .note-info { display: flex; flex-direction: column; gap: 4px; }
    .note-title { font-size: 15px; font-weight: 500; word-break: break-word; }
    .note-preview {
      font-size: 13px;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .note-time { font-size: 12px; color: var(--text2); margin-top: 2px; }

    /* Notes Toolbar */
    .notes-toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      align-items: center;
    }
    .notes-toolbar .search-input {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #3d3555;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }
    .notes-toolbar .search-input:focus { border-color: var(--accent); }
    .notes-toolbar .search-input::placeholder { color: var(--text2); }
    .icon-btn {
      background: var(--surface2);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--accent); }
    .import-label {
      position: relative;
      overflow: hidden;
    }
    .import-label input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Token Setup -->
  <div class="token-screen open" id="token-screen">
    <div class="token-box">
      <h2>连接设置</h2>
      <p>请输入 Supabase 配置和访问令牌</p>
      <input type="text" id="cfg-url" placeholder="Supabase URL" autocomplete="off">
      <input type="text" id="cfg-key" placeholder="Supabase Anon Key" autocomplete="off">
      <input type="password" id="token-input" placeholder="访问令牌 (API Token)" autocomplete="off">
      <div class="error-msg" id="token-error">配置无效，请重试</div>
      <button id="token-submit">确认连接</button>
    </div>
  </div>

  <header>
    <h1>待办 & 记事本</h1>
    <p>任务管理 + 云端笔记</p>
  </header>
  <div class="nav-tabs">
    <button class="nav-tab active" data-section="todos">待办</button>
    <button class="nav-tab" data-section="notes">记事本</button>
  </div>
  <div id="status-bar" style="background:#2d2741;padding:8px 16px;font-size:13px;color:#9b8fb8;text-align:center;">连接中...</div>

  <!-- Todo Section -->
  <div id="todo-section">
    <div class="search-bar" style="padding:10px 16px;">
      <input type="text" id="search-input" placeholder="搜索任务..." autocomplete="off" style="flex:1;background:var(--surface2);color:var(--text);border:1px solid #3d3555;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;">
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="open">待办</button>
      <button class="filter-tab" data-filter="daily">日常</button>
      <button class="filter-tab" data-filter="temporary">临时</button>
      <button class="filter-tab" data-filter="done">已完成</button>
    </div>
    <div id="todo-list"></div>
  </div>

  <!-- Notes Section -->
  <div id="notes-section" style="display:none;">
    <div class="notes-toolbar">
      <input type="text" class="search-input" id="note-search-input" placeholder="搜索笔记..." autocomplete="off">
      <button class="icon-btn" id="note-add-btn" title="新建笔记">+</button>
      <button class="icon-btn" id="note-export-btn" title="导出">&#8615;</button>
      <label class="icon-btn import-label" title="导入">
        &#8613;
        <input type="file" id="note-import-input" accept=".json">
      </label>
    </div>
    <div id="notes-list" style="padding:0 16px;"></div>
  </div>

  <form class="form-bar" id="add-form">
    <div class="form-row">
      <select id="task-type">
        <option value="temporary">临时任务</option>
        <option value="daily">日常任务</option>
      </select>
      <select id="priority">
        <option value="normal">普通</option>
        <option value="high">重要</option>
        <option value="urgent">紧急</option>
        <option value="low">低</option>
      </select>
      <input type="date" id="due-date">
    </div>
    <div class="input-row">
      <input type="text" id="todo-input" placeholder="输入待办任务..." autocomplete="off" required>
      <button type="submit" class="add-btn">添加</button>
    </div>
  </form>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>编辑任务</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="modal-field">
        <label>标题</label>
        <input type="text" id="edit-title" required>
      </div>
      <div class="modal-field">
        <label>描述</label>
        <textarea id="edit-desc" placeholder="可选"></textarea>
      </div>
      <div class="modal-field">
        <label>类型</label>
        <select id="edit-type">
          <option value="temporary">临时任务</option>
          <option value="daily">日常任务</option>
        </select>
      </div>
      <div class="modal-field">
        <label>优先级</label>
        <select id="edit-priority">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="urgent">紧急</option>
          <option value="low">低</option>
        </select>
      </div>
      <div class="modal-field">
        <label>截止日期</label>
        <input type="date" id="edit-due">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" type="button" id="modal-cancel">取消</button>
        <button class="btn-save" type="button" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Note Edit Modal -->
  <div class="modal-overlay" id="note-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>编辑笔记</h2>
        <button class="modal-close" id="note-modal-close">&times;</button>
      </div>
      <input type="hidden" id="note-edit-id">
      <div class="modal-field">
        <label>标题</label>
        <input type="text" id="note-edit-title" required>
      </div>
      <div class="modal-field">
        <label>内容</label>
        <textarea id="note-edit-content" rows="8" placeholder="写点什么..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" type="button" id="note-modal-cancel">取消</button>
        <button class="btn-save" type="button" id="note-modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
